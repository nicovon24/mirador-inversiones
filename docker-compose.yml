services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mirador
      POSTGRES_PASSWORD: mirador
      POSTGRES_DB: mirador
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - mirador-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirador -d mirador"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mirador:mirador@db:5432/mirador
      DIRECT_URL: postgresql://mirador:mirador@db:5432/mirador
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed"]
    restart: "no"

  web:
    build:
      context: .
      target: runner
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mirador:mirador@db:5432/mirador
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mirador-db:
